name: Jerney CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND_REPO: jerney-backend
  ECR_FRONTEND_REPO: jerney-frontend
  EKS_CLUSTER: jerney-eks-cluster

jobs:
  # ============================
  # STAGE 1: Build & Push
  # ============================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }} ./backend
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}

      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }} ./frontend
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}

  # ============================
  # STAGE 2: Deploy to Testing (auto)
  # ============================
  deploy-testing:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: Deploy to testing namespace
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g; s|ACCOUNT_ID|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s/manifest/*.yml
          kubectl apply -f k8s/manifest/ -n jerney-testing

  # ============================
  # STAGE 3: Deploy to Staging (manual approval)
  # ============================
  deploy-staging:
    needs: deploy-testing
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: Deploy to staging namespace
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g; s|ACCOUNT_ID|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s/manifest/*.yml
          kubectl apply -f k8s/manifest/ -n jerney-staging

  # ============================
  # STAGE 4: Deploy to Production (manual approval + rollback)
  # ============================
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to production namespace
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g; s|ACCOUNT_ID|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s/manifest/*.yml
          kubectl apply -f k8s/manifest/ -n jerney-production

      - name: Wait for rollout
        id: rollout-check
        continue-on-error: true
        run: |
          kubectl rollout status deployment/backend -n jerney-production --timeout=120s
          kubectl rollout status deployment/frontend -n jerney-production --timeout=120s

      - name: Rollback on failure
        if: steps.rollout-check.outcome == 'failure'
        run: |
          echo "Rollout failed — rolling back!"
          kubectl rollout undo deployment/backend -n jerney-production
          kubectl rollout undo deployment/frontend -n jerney-production
          exit 1

      - name: Success
        if: steps.rollout-check.outcome == 'success'
        run: echo "✅ Production deployment successful!"